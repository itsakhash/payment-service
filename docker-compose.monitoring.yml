# Local monitoring stack: Prometheus scrapes the Go server on the host, Grafana
# shows the dashboard. Start with:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# These are local development settings only (no real credentials, bound to localhost).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9091:9090" # 9091 on the host, because the Go gRPC server uses 9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
